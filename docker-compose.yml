services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: silesia_auto_skup
      POSTGRES_USER: silesia
      POSTGRES_PASSWORD: silesia
    ports:
      - "5432:5432"
    volumes:
      - silesia_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silesia -d silesia_auto_skup"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    profiles: ["full"]
    env_file: .env.local
    environment:
      DATABASE_URL: postgres://silesia:silesia@db:5432/silesia_auto_skup
      DATABASE_SSL: "false"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  silesia_postgres:
